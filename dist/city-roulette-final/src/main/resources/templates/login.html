<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - City Roulette</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>

    <section class="auth-container auth-container-compact" aria-labelledby="login-title">
        <header class="auth-header">
            <p class="eyebrow">BUSAN RANDOM TRIP</p>
            <h1 id="login-title">로그인</h1>
            <p>City Roulette에 로그인하고<br>나만의 여행 기록을 관리해보세요.</p>
        </header>

        <div class="auth-card">
            <p th:if="${param.error != null}" class="alert alert-error" role="alert">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </p>
            <p th:if="${param.logout != null}" class="alert alert-success" role="status">
                로그아웃되었습니다.
            </p>

            <form class="auth-form" th:action="@{/login}" method="post">
                <fieldset class="auth-fields">
                    <legend class="visually-hidden">계정 로그인</legend>
                    <div class="form-group">
                        <label class="form-label" for="username">아이디</label>
                        <input class="form-input" id="username" name="username" type="text"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">비밀번호</label>
                        <input class="form-input" id="password" name="password" type="password"
                               autocomplete="current-password" required>
                    </div>
                    <button class="primary-button auth-submit" type="submit">로그인</button>
                </fieldset>
            </form>
        </div>

        <p class="auth-footer">계정이 없나요? <a th:href="@{/signup}">회원가입</a></p>
    </section>
</main>
</body>
</html>
