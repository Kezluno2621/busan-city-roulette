spring.application.name=city-roulette

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cityroulette}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway가 스키마를 변경하고 Hibernate는 Entity와 스키마가 맞는지 확인합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 평소 SQL 출력은 끄고, 학습 시에만 STS 환경변수로 활성화합니다.
spring.jpa.show-sql=false

# 기존 places 테이블이 있는 개발 DB는 버전 1 기준으로 등록한 뒤 이후 migration을 적용합니다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

tour.api.base-url=https://apis.data.go.kr/B551011/KorService2
external.api.tour.key=${TOUR_API_KEY:}
external.api.busan.attraction.key=${BUSAN_ATTRACTION_API_KEY:}
external.api.busan.restaurant.key=${BUSAN_RESTAURANT_API_KEY:}
external.api.busan.foodie.key=${BUSAN_FOODIE_API_KEY:}
external.api.busan.galmaetgil.key=${BUSAN_GALMAETGIL_API_KEY:}
external.api.busan.bus.key=${BUSAN_BUS_API_KEY:}
# 기존 설정명을 사용하는 실행 환경과의 호환용 매핑입니다.
tour.api.service-key=${TOUR_API_KEY:}
tour.api.mobile-os=ETC
tour.api.mobile-app=CityRoulette
tour.import.enabled=false
tour.import.dry-run=true
tour.import.page-size=20
tour.import.limit=20
external.api.diagnostics.enabled=false
place.import.enabled=false
place.import.providers=ALL
place.import.dry-run=true
place.import.page-size=10
place.import.limit=10
place.quality.enabled=false
bus.import.enabled=false
bus.import.mode=STOPS
bus.import.dry-run=true
bus.import.page-size=10
bus.import.limit=10
bus.import.route-numbers=
bus.import.route-limit=1
bus.import.route-stop-limit=20

odsay.api.base-url=https://api.odsay.com/v1/api
odsay.api.key=${ODSAY_API_KEY:}

kakao.local.base-url=https://dapi.kakao.com
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}

# Phase 3-B recommendation scoring (each component is normalized to 0-100).
recommendation.weights.category=30
recommendation.weights.distance=30
recommendation.weights.diversity=15
recommendation.weights.data-quality=15
recommendation.weights.transit=10

# 추천 입력 기본값과 정책 상한입니다. 점수 가중치와 분리해 역할을 명확히 합니다.
recommendation.defaults.available-minutes=180
recommendation.defaults.stay-minutes=60
recommendation.defaults.ui-candidate-limit=1
recommendation.defaults.recommendation-limit=10
recommendation.limits.min-available-minutes=60
recommendation.limits.max-available-minutes=720
recommendation.limits.min-stay-minutes=30
recommendation.limits.max-stay-minutes=240
recommendation.limits.max-candidates=5
recommendation.limits.ui-max-candidates=3
recommendation.limits.candidate-pool=200
recommendation.limits.max-distance-meters=50000
recommendation.transit.radius-meters=1000
recommendation.transit.evaluation-limit=10
recommendation.origin.latitude=35.1796
recommendation.origin.longitude=129.0756
recommendation.course.recommendation-pool-limit=200
recommendation.course.default-place-count=3
recommendation.course.instant-randomness=100
recommendation.course.personalized-randomness=40
recommendation.course.category-novelty-bonus=12.0
recommendation.course.max-diversity-distance-factor=1.35
recommendation.course.max-diversity-distance-allowance-meters=1000

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
