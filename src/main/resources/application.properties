spring.application.name=city-roulette

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cityroulette}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 개발용 DB에서 Entity에 맞춰 테이블을 생성·갱신합니다. DB 자체는 미리 준비하세요.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 평소 SQL 출력은 끄고, 학습 시에만 STS 환경변수로 활성화합니다.
spring.jpa.show-sql=false
