spring.application.name=city-roulette

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cityroulette}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway가 스키마를 변경하고 Hibernate는 Entity와 스키마가 맞는지 확인합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 평소 SQL 출력은 끄고, 학습 시에만 STS 환경변수로 활성화합니다.
spring.jpa.show-sql=false

# 기존 places 테이블이 있는 개발 DB는 버전 1 기준으로 등록한 뒤 이후 migration을 적용합니다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

tour.api.base-url=https://apis.data.go.kr/B551011/KorService2
tour.api.service-key=${TOUR_API_KEY:}
tour.api.mobile-os=ETC
tour.api.mobile-app=CityRoulette

odsay.api.base-url=https://api.odsay.com/v1/api
odsay.api.key=${ODSAY_API_KEY:}

kakao.local.base-url=https://dapi.kakao.com
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
