<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">City Roulette</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/main.js}" defer></script>
</head>
<body>
<main class="home-page">
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>
    <section class="hero home-hero">
        <p class="eyebrow">BUSAN RANDOM TRIP</p>
        <h1 th:text="${title}">City Roulette</h1>
        <p>시간과 출발지만 정하면, 대중교통으로 다녀올 수 있는 부산 여행지를 골라드려요.</p>
        <div class="hero-actions">
            <a class="primary-button" th:href="@{/recommend}">🎲 룰렛 돌리기</a>
        </div>
    </section>

    <section class="feature-grid" aria-label="추천 과정">
        <article><strong>01</strong><h2>가까운 후보</h2><p>출발 좌표에서 가까운 관광지를 먼저 찾습니다.</p></article>
        <article><strong>02</strong><h2>대중교통 확인</h2><p>실제 이동시간으로 방문 가능한 장소를 확인합니다.</p></article>
        <article><strong>03</strong><h2>랜덤 추천</h2><p>시간 조건을 통과한 장소 중 하나를 골라드립니다.</p></article>
    </section>
</main>
</body>
</html>
