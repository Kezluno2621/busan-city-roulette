# 발표용 프로필입니다. 준비된 DB 스키마를 검증하는 실행 환경을 구성합니다.

# 발표용 데이터 소스는 일반 DB_* 대신 DEMO_DB_* 환경변수를 사용합니다.
server.port=${DEMO_SERVER_PORT:18090}

spring.datasource.url=jdbc:mysql://${DEMO_DB_HOST:127.0.0.1}:${DEMO_DB_PORT:33321}/${DEMO_DB_NAME:cityroulette_demo}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
# 준비된 로컬 시연 복제본의 기본 연결값입니다.
# 발표 PC의 시연 계정 설정이 다르면 환경변수로 덮어쓸 수 있습니다.
# 실제 로그인 정보는 로컬 실행 환경에서만 설정합니다.
spring.datasource.username=${DEMO_DB_USERNAME:root}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 준비된 시연 DB를 사용하므로 앱 시작 시 마이그레이션과 SQL 초기화를 끕니다.
spring.flyway.enabled=false
spring.sql.init.mode=never

tour.import.enabled=false
place.import.enabled=false
place.quality.enabled=false
bus.import.enabled=false
external.api.diagnostics.enabled=false
runtime.verification.enabled=false
bus.stop-enrichment.enabled=false
tourism.verification.enabled=false

# 키가 설정되면 카카오 일반 장소 검색을 사용할 수 있습니다.
# 키가 없으면 출발지 검색 서비스가 적재된 장소를 조회합니다.
location.search.local-only=${LOCATION_SEARCH_LOCAL_ONLY:false}
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
odsay.api.key=${ODSAY_API_KEY:}

app.upload-dir=${DEMO_UPLOAD_DIR:.runtime-demo/uploads}
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false

server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.include-message=never
