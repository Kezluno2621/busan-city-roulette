# 개발 프로필에서 적용되는 데이터베이스와 개발 도구 설정입니다.

# 개발 DB에 미적용 마이그레이션을 실행하려면 해당 실행에서 명시적으로 활성화해야 합니다.
spring.flyway.enabled=${RUNTIME_ALLOW_MIGRATIONS:false}

runtime.verification.enabled=${RUNTIME_VERIFICATION_ENABLED:false}
runtime.verification.mode=${RUNTIME_VERIFICATION_MODE:INSPECT}
runtime.verification.expected-database=${RUNTIME_EXPECTED_DATABASE:}
runtime.verification.backup-confirmed=${RUNTIME_BACKUP_CONFIRMED:false}
runtime.verification.route-number=${RUNTIME_ROUTE_NUMBER:}

bus.stop-enrichment.enabled=${BUS_STOP_ENRICHMENT_ENABLED:false}
bus.stop-enrichment.dry-run=${BUS_STOP_ENRICHMENT_DRY_RUN:true}
bus.stop-enrichment.route-number=${BUS_STOP_ENRICHMENT_ROUTE_NUMBER:}
bus.stop-enrichment.limit=${BUS_STOP_ENRICHMENT_LIMIT:20}

# STS 실행 설정에서 명시적으로 선택한 경우에만 관광 수집 수동 검증을 실행합니다.
tourism.verification.enabled=${TOURISM_VERIFICATION_ENABLED:false}
tourism.verification.mode=${TOURISM_VERIFICATION_MODE:INSPECT}
tourism.verification.providers=${TOURISM_VERIFICATION_PROVIDERS:ALL}
tourism.verification.page-size=${TOURISM_VERIFICATION_PAGE_SIZE:20}
tourism.verification.limit=${TOURISM_VERIFICATION_LIMIT:20}
tourism.verification.expanded-limit-enabled=${TOURISM_VERIFICATION_EXPANDED_LIMIT_ENABLED:false}
tourism.verification.expected-database=${TOURISM_VERIFICATION_EXPECTED_DATABASE:}
tourism.verification.expected-jdbc-url-sha256=${TOURISM_VERIFICATION_EXPECTED_JDBC_URL_SHA256:}
tourism.verification.original-jdbc-url-sha256=${TOURISM_VERIFICATION_ORIGINAL_JDBC_URL_SHA256:}
tourism.verification.isolated-database-confirmed=${TOURISM_VERIFICATION_ISOLATED_DATABASE_CONFIRMED:false}
tourism.verification.backup-file=${TOURISM_VERIFICATION_BACKUP_FILE:}
tourism.verification.backup-sha256=${TOURISM_VERIFICATION_BACKUP_SHA256:}
