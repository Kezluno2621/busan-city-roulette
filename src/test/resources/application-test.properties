# An in-memory database used only by tests, not a MySQL connection check.
spring.datasource.url=jdbc:h2:mem:cityroulette-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
