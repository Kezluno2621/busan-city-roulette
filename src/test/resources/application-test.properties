
# 테스트는 메모리 DB에서 실행합니다. 실제 MySQL 연결 확인은 별도 검증입니다.
spring.datasource.url=jdbc:h2:mem:cityroulette-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
app.upload-dir=${java.io.tmpdir}/cityroulette-test-uploads
